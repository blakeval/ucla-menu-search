name: Update UCLA menu data

# Runs every morning and whenever you manually trigger it from the Actions tab.
# Cron time is in UTC — 17:00 UTC is 10:00am Pacific (9:00am during daylight
# saving). Pushed later than 6am so UCLA's page has actually posted the
# day's menu before we scrape it — running too early was likely why the
# site was showing yesterday's menu.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}  # adds a "Run workflow" button so you can trigger it by hand

permissions:
  contents: write  # lets the workflow commit the updated menu.json back to the repo

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run the scraper
        run: python scrape_ucla_dining.py > menu.json

      - name: Commit the updated menu, if it changed
        run: |
          git config user.name "menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add menu.json
          git diff --cached --quiet || git commit -m "Update menu data"
          git push
